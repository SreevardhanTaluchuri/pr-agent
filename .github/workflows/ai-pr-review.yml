name: Sync FLO File Changes Across UAT Branches

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - uat_na
      - uat_emea
      - uat_apac
      - uat_latam
  workflow_dispatch:

jobs:
  sync-flo-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install GitHub CLI
        run: |
          # GitHub CLI is pre-installed on GitHub Actions runners
          # This step is here for documentation purposes
          gh --version

      - name: Run FLO File Sync Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          CURRENT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/scripts/sync_flo_files.py